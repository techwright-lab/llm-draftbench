[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "draftbench"
version = "0.1.0"
description = "Portable suite validation, offline replay and explicitly approved bounded drafting pilots"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
draftbench = "draftbench.cli:main"

[project.optional-dependencies]
inspect = [
    "inspect-ai==0.3.223",
]
openai = [
    "httpx==0.28.1",
    "openai==2.29.0",
]

anthropic = ["httpx==0.28.1", "anthropic==0.84.0"]
pilot = ["packaging>=24.2,<27", "jsonschema>=4.23,<5", "httpx==0.28.1", "openai==2.29.0", "anthropic==0.84.0"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/draftbench"]
exclude = ["**/.env", "**/.env.*"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "schemas/", "README.md", "SECURITY.md", "CONTRIBUTING.md", "BENCHMARK_CARD.md", "LICENSE", "NOTICE", "pyproject.toml", "uv.lock", ".python-version"]
exclude = [".env", ".env.*", "**/.env", "**/.env.*", "**/__pycache__", "**/*.pyc"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
